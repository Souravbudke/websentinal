<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSentinal Security</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>WebSentinal Security</h1>
  </div>
  
  <div class="content">
    <div id="status-container">
      <!-- Status will be inserted here by JavaScript -->
    </div>
    
    <div id="warning-message" class="warning-message" style="display: none;">
      <div class="icon">⚠️</div>
      <div class="message">
        <strong>Warning: Potentially Unsafe</strong>
        <p>This website may be dangerous. Proceed with caution.</p>
      </div>
    </div>
    
    <div class="details">
      <h3>Website Details</h3>
      <div class="detail-item">
        <span class="detail-label">URL:</span>
        <span id="current-url" class="detail-value"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Trust Score:</span>
        <span id="trust-score" class="detail-value">--</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Domain Age:</span>
        <span id="domain-age" class="detail-value">--</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Domain Rank:</span>
        <span id="domain-rank" class="detail-value">--</span>
      </div>
    </div>
  </div>
  
  <a href="http://localhost:5001" target="_blank" class="button" id="full-analysis-btn">Full Analysis</a>
  
  <div class="footer">
    Powered by WebSentinal Security
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
