<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSentinal Security</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 350px;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }
    
    .header {
      background-color: #4a6cf7;
      color: white;
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #3a5ce5;
    }
    
    .header h1 {
      margin: 0;
      font-size: 20px;
    }
    
    .content {
      padding: 15px;
    }
    
    .status {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
    }
    
    .status-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 15px;
      font-size: 20px;
    }
    
    .safe {
      background-color: #e6f7e6;
      border: 1px solid #c3e6cb;
    }
    
    .safe .status-icon {
      background-color: #28a745;
      color: white;
    }
    
    .unsafe {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }
    
    .unsafe .status-icon {
      background-color: #dc3545;
      color: white;
    }
    
    .unknown {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
    }
    
    .unknown .status-icon {
      background-color: #ffc107;
      color: white;
    }
    
    .status-text h2 {
      margin: 0;
      font-size: 16px;
    }
    
    .status-text p {
      margin: 5px 0 0 0;
      font-size: 14px;
    }
    
    .details {
      background-color: white;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .details h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #4a6cf7;
    }
    
    .detail-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .detail-label {
      color: #6c757d;
    }
    
    .detail-value {
      font-weight: 500;
    }
    
    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #6c757d;
      border-top: 1px solid #dee2e6;
    }
    
    .button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #4a6cf7;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    
    .button:hover {
      background-color: #3a5ce5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WebSentinal Security</h1>
  </div>
  
  <div class="content">
    <div id="status-container">
      <!-- Status will be inserted here by JavaScript -->
      <div class="status unknown">
        <div class="status-icon">?</div>
        <div class="status-text">
          <h2>Checking website...</h2>
          <p>Please wait while we analyze this website.</p>
        </div>
      </div>
    </div>
    
    <div id="details-container" class="details">
      <h3>Website Details</h3>
      <div class="detail-item">
        <span class="detail-label">URL:</span>
        <span class="detail-value" id="current-url">Loading...</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Trust Score:</span>
        <span class="detail-value" id="trust-score">--</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Domain Age:</span>
        <span class="detail-value" id="domain-age">--</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Domain Rank:</span>
        <span class="detail-value" id="domain-rank">--</span>
      </div>
    </div>
    
    <a href="http://localhost:5001" target="_blank" class="button">Full Analysis</a>
  </div>
  
  <div class="footer">
    Powered by WebSentinal Security
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
